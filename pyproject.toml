[build-system]
requires = ["uv_build >= 0.11.7"]
build-backend = "uv_build"

[project]
name = "hanzi-deck"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anki>=25.9.2",
    "cbor2>=6.1.0",
    "flask>=3.1.3",
    "genanki>=0.13.1",
    "pydantic>=2.13.3",
    "typer>=0.24.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

[project.scripts]
hanzi-generate = "hanzi_deck.generate:app"
hanzi-preview = "hanzi_deck.preview_cli:app"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
# Always print a full diff on assertion failures.
verbosity_assertions = 2
addopts = [
    # https://docs.pytest.org/en/stable/explanation/goodpractices.html#which-import-mode
    "--import-mode=importlib",
    "--cov=src",
    "--doctest-modules",
]
# Treat warnings as errors.
filterwarnings = [
    "error",
]
